<!DOCTYPE html>
<html>
<head>
    <title>Patient History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">

<h3 class="text-center">Patient History</h3>

<div class="container mt-4">

    <p><strong>Patient Name:</strong> {{ patient.name }}</p>

    <table class="table table-bordered table-striped mt-4">
        <thead class="table-dark">
            <tr>
                <th>Visit No</th>
                <th>Diagnosis</th>
                <th>Prescription</th>
                <th>Full Notes</th>
            </tr>
        </thead>
        <tbody>
            {% if history %}
                {% for h in history %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ h.diagnosis }}</td>
                    <td>{{ h.prescription }}</td>
                    <td><pre>{{ h.notes }}</pre></td>
                </tr>
                {% endfor %}
            {% else %}
            <tr><td colspan="4" class="text-center text-muted">No history available</td></tr>
            {% endif %}
        </tbody>
    </table>

    <a class="btn btn-secondary mt-3" href="{{ url_for('doctor_dashboard') }}">Back</a>

</div>
</body>
</html>
