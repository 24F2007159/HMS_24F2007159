<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f4f9;
            font-family: Arial, sans-serif;
        }
        .header-bar {
            background: linear-gradient(90deg, #1a73e8, #4a9eff);
            color: #fff;
            padding: 20px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
        }
        .form-card {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .form-title {
            color: #1a73e8;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtext {
            text-align: center;
            color: #6c757d;
            margin-bottom: 18px;
            font-size: 0.95rem;
        }
        .btn-primary, .btn-secondary, .btn-success {
            border-radius: 8px;
            padding: 10px 14px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header-bar">
        HOSPITAL MANAGEMENT SYSTEM
    </div>

    <!-- Edit Patient Form -->
    <div class="form-card">
        <h3 class="form-title">Edit Patient – {{ patient.name }}</h3>
        <div class="subtext">Update personal details and medical history.</div>

        {% if error %}
        <div class="alert alert-danger text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" value="{{ patient.name }}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" value="{{ patient.age }}" class="form-control" min="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="Male"   {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other"  {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Contact Number</label>
                <input type="number" name="contact_num" value="{{ patient.contact_num }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" value="{{ patient.address }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Medical History</label>
                <textarea name="medical_history" class="form-control" rows="4" required>{{ patient.medical_history }}</textarea>
            </div>

            <div class="d-grid d-md-flex justify-content-md-between gap-2">
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back to Admin Dashboard</a>
                <button type="submit" class="btn btn-success">Update Patient</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
