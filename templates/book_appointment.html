<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="text-bg-primary p-3 text-center fs-4 fw-bold">
    Book Appointment
  </div>

  <div class="container mt-4 mb-5 p-4 border rounded bg-light shadow-sm" style="max-width:700px;">
    <form method="POST">
      <!-- Step 1: Select Department -->
      <div class="mb-4">
        <label class="form-label fw-bold">Select Department</label>
        <select name="department_id" class="form-select" onchange="this.form.submit()">
          <option value="">-- Choose Department --</option>
          {% for dep in departments %}
          <option value="{{ dep.id }}" {% if selected_department == dep.id %}selected{% endif %}>
            {{ dep.name }}
          </option>
          {% endfor %}
        </select>
      </div>

      <!-- Step 2: Select Doctor -->
      {% if doctors %}
      <div class="mb-4">
        <label class="form-label fw-bold">Select Doctor</label>
        <select name="doctor_id" class="form-select" onchange="this.form.submit()">
          <option value="">-- Choose Doctor --</option>
          {% for doc in doctors %}
          <option value="{{ doc.id }}" {% if selected_doctor == doc.id %}selected{% endif %}>
            Dr. {{ doc.name }} — {{ doc.specialization }}
          </option>
          {% endfor %}
        </select>
      </div>
      {% endif %}

      <!-- Step 3: Select Slot -->
      {% if slots %}
      <div class="mb-4">
        <label class="form-label fw-bold">Available Slots</label>
        <select name="slot_id" class="form-select">
          <option value="">-- Choose Date & Time --</option>
          {% for s in slots %}
          <option value="{{ s.id }}">
            {{ s.appointment_date.strftime('%d/%m/%Y') }} — {{ s.appointment_time.strftime('%I:%M %p') }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success btn-lg">Confirm Booking</button>
        <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary btn-lg">Cancel</a>
      </div>
      {% endif %}
    </form>
  </div>
</body>
</html>
