<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f9;
            font-family: Arial, sans-serif;
        }

        /* Top Banner */
        .header-bar {
            background: linear-gradient(90deg, #1a73e8, #4a9eff);
            color: white;
            padding: 20px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Centered Login Card */
        .login-card {
            max-width: 420px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 700;
            color: #1a73e8;
        }

        .home-link {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .home-link a {
            text-decoration: none;
            font-weight: bold;
            color: #1a73e8;
        }
        .home-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header-bar">
        HOSPITAL MANAGEMENT SYSTEM
    </div>

    <!-- Login Card -->
    <div class="login-card">

        <h2>Admin Login</h2>

        {% if error %}
        <div class="alert alert-danger text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/adminlogin" method="post">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="u_name" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="pwd" class="form-control" placeholder="Enter password" required>
            </div>

            <div class="text-center">
                <button class="btn btn-primary px-4">Login</button>
            </div>

        </form>

        <div class="home-link">
            Go to Home → <a href="/home">Click Here</a>
        </div>

    </div>

</body>
</html>
