<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Department</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f9;
            font-family: Arial, sans-serif;
        }

        /* Top Header Banner */
        .header-bar {
            background: linear-gradient(90deg, #1a73e8, #4a9eff);
            color: white;
            padding: 20px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Center Card Box */
        .form-card {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-card h3 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
            color: #1a73e8;
        }

        .dashboard-link {
            text-align: center;
            margin-top: 12px;
        }
        .dashboard-link a {
            text-decoration: none;
            font-weight: bold;
            color: #1a73e8;
        }
        .dashboard-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header-bar">
        HOSPITAL MANAGEMENT SYSTEM
    </div>

    <!-- Form Section -->
    <div class="form-card">

        <h3>Create New Department</h3>

        {% if error %}
        <div class="alert alert-danger text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/createdept" method="post">

            <div class="mb-3">
                <label class="form-label">Department Name</label>
                <input type="text" class="form-control" name="name"
                       placeholder="Enter Department Name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department Description</label>
                <input type="text" class="form-control" name="desc"
                       placeholder="Enter Description" required>
            </div>

            <div class="text-center mt-3">
                <button class="btn btn-primary px-4">Create</button>
            </div>
        </form>

        <div class="dashboard-link">
            Go to Dashboard → <a href="/admindashboard">Click Here</a>
        </div>
    </div>

</body>
</html>
