<!DOCTYPE html>
<html>
<head>
    <title>Edit Department</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f7ff;
            color: #333333;
            font-family: Arial, sans-serif;
        }
        #department-form-body {
            max-width: 700px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0d6efd;
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="department-form-body">
        <h2>Edit Department</h2>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="/editdepartment/{{ department.id }}" method="post">
            <div class ="mb-3">
                <label for="name" class="form-label">Department Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       placeholder="Enter department name" value="{{ department.name }}" required>
            </div>

            <div class="mb-3">
                <label for = "desc" class="form-label">Description</label>
                <textarea class="form-control" id="desc" name="desc" rows="4"
                          placeholder="Enter department description " value = "{{ department.description }}" required></textarea>
            </div>

            <div class="text-center">
                <input type="submit" class="btn btn-primary" value="Update Department">
            </div>
        </form>

        <br>
        <div class="text-center">
            <a href="/admindashboard" class="btn btn-secondary">Back to Admin Dashboard</a>
        </div>
    </div>
</body>
</html>
