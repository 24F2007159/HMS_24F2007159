<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor's Availability</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    .availability-box {
      border:1px solid #ddd;
      border-radius:10px;
      padding:25px 30px;
      background:#fff;
      max-width:700px;
      margin:auto;
      box-shadow:0 3px 8px rgba(0,0,0,0.05);
    }
    .day-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #eee;
      padding:10px 0;
    }
    .day-label { font-weight:500; width:120px; }
    .slot {
      width:180px;
      text-align:center;
      font-size:0.9rem;
      border-radius:6px;
      padding:5px 0;
      cursor:pointer;
    }
    .active-slot { background-color:#28a745; color:white; }
    .inactive-slot { background-color:#f8d7da; color:#721c24; }
    .btn-save { margin-top:25px; }
  </style>
</head>
<body>
  <!-- Page header -->
  <div class="text-bg-primary p-3 text-center fs-4 fw-bold">
    Manage Availability (Next 7 Days)
  </div>

  <!-- Availability box -->
  <div class="container mt-4 availability-box">
    <!-- ✅ Heading exactly like the wireframe -->
    <h4 class="text-center mb-4 fw-bold">Doctor's Availability</h4>

    <form method="POST">
      {% for day in next_7_days %}
      <div class="day-row">
        <span class="day-label">{{ day.strftime("%d/%m/%Y") }}</span>

        <!-- Morning Slot -->
        <label class="slot {% if day in morning_dates %}active-slot{% else %}inactive-slot{% endif %}">
          <input type="checkbox" name="morning" value="{{ day.strftime('%Y-%m-%d') }}"
                 {% if day in morning_dates %}checked{% endif %} hidden>
          08:00 – 12:00 am
        </label>

        <!-- Evening Slot -->
        <label class="slot {% if day in evening_dates %}active-slot{% else %}inactive-slot{% endif %}">
          <input type="checkbox" name="evening" value="{{ day.strftime('%Y-%m-%d') }}"
                 {% if day in evening_dates %}checked{% endif %} hidden>
          04:00 – 09:00 pm
        </label>
      </div>
      {% endfor %}

      <div class="text-center btn-save">
        <button type="submit" class="btn btn-success btn-lg">Save</button>
        <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-secondary btn-lg">Back</a>
      </div>
    </form>
  </div>

  <script>
    // Toggle color change on click
    document.querySelectorAll('.slot').forEach(slot => {
      slot.addEventListener('click', () => {
        const checkbox = slot.querySelector('input');
        checkbox.checked = !checkbox.checked;
        slot.classList.toggle('active-slot', checkbox.checked);
        slot.classList.toggle('inactive-slot', !checkbox.checked);
      });
    });
  </script>
</body>
</html>
