<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f5f7fa; }
        .top-bar {
            background: linear-gradient(90deg, #1a73e8, #4a9eff);
            padding: 18px;
            color: white;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .label {
            font-weight: 600;
            color: #555;
        }
    </style>
</head>

<body>

<div class="top-bar">
    Dr. {{ doctor.name }}
</div>

<div class="container mt-4">

    <a href="{{ url_for('department_details', dep_id=doctor.department_id) }}"
       class="btn btn-secondary mb-3">← Back</a>

    <div class="card p-4">

        <h4 class="mb-3">Doctor Profile</h4>

        <div class="row mb-3">
            <div class="col-md-4 label">Full Name:</div>
            <div class="col-md-8">{{ doctor.name }}</div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4 label">Specialization:</div>
            <div class="col-md-8">{{ doctor.specialization }}</div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4 label">Qualification:</div>
            <div class="col-md-8">{{ doctor.qualification }}</div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4 label">Experience:</div>
            <div class="col-md-8">{{ doctor.experience }} years</div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4 label">Consultation Fee:</div>
            <div class="col-md-8">₹ {{ doctor.fee }}</div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4 label">Department:</div>
            <div class="col-md-8">{{ doctor.department.name }}</div>
        </div>

        <hr>

        <!-- Availability Button -->
        <div class="text-center mt-3">
            <a href="{{ url_for('doctor_availability', doctor_id=doctor.id) }}"
               class="btn btn-primary btn-lg">
                View Availability
            </a>
        </div>

    </div>
</div>

</body>
</html>
