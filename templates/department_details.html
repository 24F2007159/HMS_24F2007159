<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ department.name }} - Department Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="text-bg-primary p-3 text-center fs-4 fw-bold">
    Department of {{ department.name }}
  </div>

  <div class="container mt-4 mb-5 p-4 border rounded bg-light shadow-sm">
    <h4 class="fw-bold">Overview</h4>
    <p>{{ department.description }}</p>

    <hr>
    <h5 class="fw-bold mb-3">Doctors' List</h5>

    {% for doc in doctors %}
    <div class="d-flex justify-content-between align-items-center border rounded p-3 mb-3 bg-white">
      <div>
        <strong>Dr. {{ doc.name }}</strong><br>
        <small>{{ doc.designation }} | {{ doc.specialization }}</small>
      </div>
      <div>
        <a href="{{ url_for('doctor_availability', doctor_id=doc.id) }}" class="btn btn-outline-success me-2">
          Check Availability
        </a>
        <a href="{{ url_for('doctor_details', doctor_id=doc.id) }}" class="btn btn-outline-primary">View Details</a>
      </div>
    </div>
    {% else %}
    <p>No doctors found for this department.</p>
    {% endfor %}

    <div class="text-center mt-4">
      <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
