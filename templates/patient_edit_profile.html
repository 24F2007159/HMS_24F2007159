<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f7f9fc; }
        .edit-card {
            max-width: 650px;
            margin: auto;
            margin-top: 40px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<div class="card edit-card p-4">
    <h3 class="text-center mb-3 text-primary fw-bold">Edit Your Profile</h3>
    <hr>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" name="name" class="form-control"
                   value="{{ patient.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Age</label>
            <input type="number" name="age" class="form-control"
                   value="{{ patient.age }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Gender</label>
            <select name="gender" class="form-select" required>
                <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Contact Number</label>
            <input type="text" name="contact_num" class="form-control"
                   value="{{ patient.contact_num }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Address</label>
            <textarea name="address" class="form-control" rows="2" required>{{ patient.address }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Medical History</label>
            <textarea name="medical_history" class="form-control" rows="3"
                      required>{{ patient.medical_history }}</textarea>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="{{ url_for('patient_dashboard') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button class="btn btn-primary px-4">Save Changes</button>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
