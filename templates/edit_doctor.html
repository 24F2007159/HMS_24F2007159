<!DOCTYPE html>
<html>
<head>
    <title>Edit Doctor</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f7ff;
            color: #333333;
            font-family: Arial, sans-serif;
        }
        #doctor-form-body {
            max-width: 700px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0d6efd;
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="doctor-form-body">
        <h2>Edit Doctor</h2>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="/editdoctor/{{ doctor.id }}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Doctor Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter doctor name"
                    value="{{ doctor.name }}" required>
            </div>

            <div class="mb-3">
                <label for="qual" class="form-label">Qualification</label>
                <input type="text" class="form-control" id="qual" name="qual" placeholder="Enter qualification"
                    value="{{ doctor.qualification }}" required>
            </div>

            <div class="mb-3">
                <label for="exp" class="form-label">Experience (in years)</label>
                <input type="number" class="form-control" id="exp" name="exp" placeholder="Enter experience"
                    value="{{ doctor.experience }}" min="0" required>
            </div>

            <div class="mb-3">
                <label for="fee" class="form-label">Consultation Fee</label>
                <input type="number" class="form-control" id="fee" name="fee" placeholder="Enter fee"
                    value="{{ doctor.fee }}" min="0" required>
            </div>

            <div class="mb-3">
                <label for="specialization" class="form-label">Specialization</label>
                <input type="text" class="form-control" id="specialization" name="specialization"
                    placeholder="Enter specialization" value="{{ doctor.specialization }}" required>
            </div>

            <div class="mb-3">
                <label for="desig" class="form-label">Designation</label>
                <input type="text" class="form-control" id="desig" name="desig"
                    placeholder="Enter designation" value="{{ doctor.designation }}" required>
            </div>

            <div class="mb-3">
                <label for="reg_num" class="form-label">Registration Number</label>
                <input type="text" class="form-control" id="reg_num" name="reg_num"
                    placeholder="Enter registration number" value="{{ doctor.registration_num }}" required>
            </div>

            <div class="mb-3">
                <label for="dep_id" class="form-label">Department</label>
                <select class="form-select" id="dep_id" name="dep_id" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="pwd" class="form-label">Password (leave blank to keep current)</label>
                <input type="password" class="form-control" id="pwd" name="pwd"
                    placeholder="Enter new password if you want to change it">
            </div>

            <div class="text-center">
                <input type="submit" class="btn btn-primary" value="Update Doctor">
            </div>
        </form>

        <br>
        <div class="text-center">
            <a href="/admindashboard" class="btn btn-secondary">Back to Admin Dashboard</a>
        </div>
    </div>
</body>
</html>
