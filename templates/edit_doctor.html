<!DOCTYPE html>
<html>
<head>
    <title>Edit Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f9;
            font-family: Arial, sans-serif;
        }

        /* HMS header to match home/admin */
        .header-bar {
            background: linear-gradient(90deg, #1a73e8, #4a9eff);
            color: #fff;
            padding: 20px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
        }

        /* Card container */
        .form-card {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .form-title {
            color: #1a73e8;
            font-weight: 700;
            text-align: center;
            margin-bottom: 18px;
        }

        .subtext {
            text-align: center;
            color: #6c757d;
            margin-bottom: 18px;
            font-size: 0.95rem;
        }

        .btn-primary, .btn-secondary {
            border-radius: 8px;
            padding: 10px 14px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header-bar">
        HOSPITAL MANAGEMENT SYSTEM
    </div>

    <!-- Edit Doctor Form -->
    <div class="form-card">
        <h3 class="form-title">Edit Doctor</h3>
        <div class="subtext">Update the doctor’s profile, specialization, and department.</div>

        {% if error %}
        <div class="alert alert-danger text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="/editdoctor/{{ doctor.id }}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Doctor Name</label>
                    <input type="text" class="form-control" id="name" name="name"
                           placeholder="Enter doctor name"
                           value="{{ doctor.name }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="qual" class="form-label">Qualification</label>
                    <input type="text" class="form-control" id="qual" name="qual"
                           placeholder="e.g., MBBS, MD"
                           value="{{ doctor.qualification }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="exp" class="form-label">Experience (years)</label>
                    <input type="number" class="form-control" id="exp" name="exp"
                           placeholder="Enter experience"
                           value="{{ doctor.experience }}" min="0" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="fee" class="form-label">Consultation Fee</label>
                    <input type="number" class="form-control" id="fee" name="fee"
                           placeholder="Enter fee"
                           value="{{ doctor.fee }}" min="0" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="dep_id" class="form-label">Department</label>
                    <select class="form-select" id="dep_id" name="dep_id" required>
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}"
                                {% if dept.id == doctor.department_id %}selected{% endif %}>
                            {{ dept.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="specialization" class="form-label">Specialization</label>
                    <input type="text" class="form-control" id="specialization" name="specialization"
                           placeholder="e.g., Cardiologist"
                           value="{{ doctor.specialization }}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="desig" class="form-label">Designation</label>
                    <input type="text" class="form-control" id="desig" name="desig"
                           placeholder="e.g., Senior Consultant"
                           value="{{ doctor.designation }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="reg_num" class="form-label">Registration Number</label>
                <input type="text" class="form-control" id="reg_num" name="reg_num"
                       placeholder="Enter registration number"
                       value="{{ doctor.registration_num }}" required>
            </div>

            <div class="mb-3">
                <label for="pwd" class="form-label">Password (leave blank to keep current)</label>
                <input type="password" class="form-control" id="pwd" name="pwd"
                       placeholder="Enter new password if you want to change it">
            </div>

            <div class="d-grid d-md-flex justify-content-md-between gap-2">
                <a href="/admindashboard" class="btn btn-secondary">Back to Admin Dashboard</a>
                <button type="submit" class="btn btn-primary">Update Doctor</button>
            </div>
        </form>
    </div>

</body>
</html>
