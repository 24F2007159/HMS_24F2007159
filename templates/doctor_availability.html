<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor's Availability</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    .availability-box {
      border:1px solid #ddd; border-radius:10px; padding:25px; background:#fff;
      max-width:700px; margin:auto;
    }
    .slot-row {
      display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px solid #eee; padding:8px 0;
    }
    .slot-select { width:100%; }
  </style>
</head>
<body>
  <div class="text-bg-primary p-3 text-center fs-4 fw-bold">
    Dr. {{ doctor.name }} — Availability
  </div>

  <div class="container mt-4 availability-box">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-bold">Select a Time Slot</label>
        <select name="slot_id" class="form-select slot-select" required>
          <option value="">-- Choose Date & Time --</option>
          {% for s in slots %}
          <option value="{{ s.id }}">
            {{ s.appointment_date.strftime('%d/%m/%Y') }} — {{ s.appointment_time.strftime('%I:%M %p') }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success btn-lg">Book</button>
        <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary btn-lg">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
